
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>顧客管理｜花生一生後台</title>

  <!-- Base -->
  <link rel="stylesheet" href="../assets/css/base/variables.css" />
  <link rel="stylesheet" href="../assets/css/base/reset.css" />

  <!-- Layout -->
  <link rel="stylesheet" href="../assets/css/layout/layout.css" />
  <link rel="stylesheet" href="../assets/css/layout/sidebar.css" />
  <link rel="stylesheet" href="../assets/css/layout/header.css" />

  <!-- Components -->
  <link rel="stylesheet" href="../assets/css/components/buttons.css" />
  <link rel="stylesheet" href="../assets/css/components/forms.css" />
  <link rel="stylesheet" href="../assets/css/components/cards.css" />
  <link rel="stylesheet" href="../assets/css/components/tables.css" />
  <link rel="stylesheet" href="../assets/css/components/badges.css" />

  <!-- Page -->
  <link rel="stylesheet" href="../assets/css/pages/customers.css?v=20260831" />

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="../assets/css/palette-system.css?v=20260807-font-fix" />
</head>

<body>
  <div class="admin-layout">

    <!-- Sidebar -->
    <aside class="sidebar" id="adminSidebar">
      <div class="brand">
        <div class="brand-icon" aria-hidden="true">◌</div>
        <div>
          <h1>花生一生</h1>
          <p>品牌營運系統</p>
        </div>
      </div>

      <nav class="nav-menu">
        <a href="../index.html"><span aria-hidden="true">一</span>儀表板</a>
        <a href="products.html"><span aria-hidden="true">二</span>商品管理</a>
        <a href="orders.html"><span aria-hidden="true">三</span>訂單管理</a>
        <a href="customers.html" class="active"><span aria-hidden="true">四</span>顧客管理</a>
        <a href="articles.html"><span aria-hidden="true">五</span>品牌內容</a>
        <a href="analytics.html"><span aria-hidden="true">六</span>品牌分析</a>
        <a href="settings.html"><span aria-hidden="true">七</span>系統設定</a>
      </nav>

      <div class="sidebar-footer">
        <button id="logoutButton" type="button" class="sidebar-logout">
          登出後台
        </button>
      </div>
    </aside>

    <!-- Main -->
    <main class="main customers-main">

      <!-- Hero -->
      <header class="page-hero customers-hero">
        <div class="page-hero__content">
          <p class="page-hero__eyebrow">顧客關係管理</p>
          <h1 class="page-hero__title">顧客管理</h1>
          <p class="page-hero__description">
            集中查看顧客資料、有效購買、累積消費與完整訂單紀錄。
          </p>
        </div>

      </header>

      <!-- KPI -->
      <section class="customers-kpi-grid">
        <article class="customer-kpi-card">
          <span>顧客總數</span>
          <strong id="totalCustomers">0</strong>
          <p>已建立正式顧客資料的人數</p>
        </article>

        <article class="customer-kpi-card">
          <span>回購顧客</span>
          <strong id="repeatCustomers">0</strong>
          <p>有效購買達 2 次以上</p>
        </article>

        <article class="customer-kpi-card">
          <span>顧客累積消費</span>
          <strong id="customerRevenue">NT$ 0</strong>
          <p>已付款且未取消的累積金額</p>
        </article>

        <article class="customer-kpi-card">
          <span>需關注</span>
          <strong id="problemCustomers">0</strong>
          <p>問題訂單或資料待確認</p>
        </article>
      </section>

      <!-- Filters -->
      <section class="customers-filters-panel">
        <div class="customers-filters">

          <div class="filter-group filter-search">
            <label for="customerSearchInput">搜尋顧客</label>
            <input
              type="search"
              id="customerSearchInput"
              placeholder="搜尋姓名、電話、Email"
              autocomplete="off"
            />
          </div>

          <div class="filter-group">
            <label for="customerTypeFilter">顧客類型</label>
            <select id="customerTypeFilter">
              <option value="all">全部顧客</option>
              <option value="repeat">回購顧客</option>
              <option value="vip">高消費顧客</option>
              <option value="problem">需關注顧客</option>
            </select>
          </div>

          <div class="filter-group">
            <label for="customerSortSelect">排序方式</label>
            <select id="customerSortSelect">
              <option value="latest">最近下單</option>
              <option value="revenue">累積消費最高</option>
              <option value="orders">訂單數最多</option>
            </select>
          </div>

          <div class="filter-group filter-reset">
            <label>&nbsp;</label>
            <button type="button" class="btn secondary" id="resetCustomerFiltersBtn">
              清除篩選
            </button>
          </div>

          <div class="content-actions">
            <button type="button" class="btn secondary" id="refreshCustomersBtn">重新整理</button>
            <button type="button" class="btn primary" id="exportCustomersBtn">匯出顧客列表</button>
          </div>

        </div>
      </section>

      <!-- Customers Panel -->
      <section class="customers-panel">
        <div class="panel-header">
          <div>
            <h3>顧客列表</h3>
            <p id="customersStatusText">尚未讀取顧客資料</p>
          </div>
        </div>

        <!-- Desktop Table -->
        <div class="admin-table-wrap customers-desktop-table">
          <table class="admin-table customers-table">
            <thead>
              <tr>
                <th>顧客</th>
                <th>電話</th>
                <th>Email</th>
                <th>有效購買</th>
                <th>累積消費</th>
                <th>最近下單</th>
                <th>狀態</th>
                <th>操作</th>
              </tr>
            </thead>

            <tbody id="customersTableBody">
              <tr>
                <td colspan="8">顧客資料讀取中...</td>
              </tr>
            </tbody>
          </table>
        </div>

        <!-- Mobile Cards -->
        <div class="customers-mobile-list" id="customersMobileList">
          <p class="customers-empty-text">顧客資料讀取中...</p>
        </div>
      </section>

    </main>
  </div>

  <!-- Services -->
  <script src="../assets/js/services/supabase-config.js"></script>
  <script src="../assets/js/services/auth-guard.js"></script>
  <script src="../assets/js/layout/sidebar.js?v=20260712"></script>
  <script>
    document.getElementById("logoutButton")?.addEventListener("click", async () => {
      const button = document.getElementById("logoutButton");

      button.disabled = true;
      button.textContent = "登出中…";

      const { error } = await supabaseClient.auth.signOut();

      if (error) {
        console.error("登出失敗：", error);
        button.disabled = false;
        button.textContent = "登出後台";
        alert("登出失敗，請稍後再試。");
        return;
      }

      window.location.replace("../login.html");
    });
  </script>

  <!-- Page -->
  <script src="../assets/js/pages/customers.js?v=20260831"></script>
</body>
</html>
